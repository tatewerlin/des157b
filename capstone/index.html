<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- stylesheet -->
    <link href="styles.css" rel="stylesheet">
    <!-- JS -->
    <script src="script.js" defer></script>

    <title>Capstone Title</title>
</head>
<body>
    <main>

        <section id="prompt-section-0" class="prompt-section">

            <h2 class="prompt-header">
                When I think about the future I feel 
                <span id="default-mouseout-input" class="blank-underline"></span>
                <span class="current-hover-input hidden"></span>
            </h2>

            <div id="prompt-section-0-contents" class="prompt-section-contents">
                <ul class="binary-button-container">
                    <li class="binary-button cell pointer-on-hover">optimistic</li>
                    <li class="binary-button cell pointer-on-hover">pessimistic</li>
                </ul>
                <h3 class="advance-button advance-button-inactive"><span class="arrow">&rarr;</span> <!-- → --></h3>
            </div>
        </section>

        <section id="prompt-section-1" class="prompt-section">
            <h2 class="prompt-header">
                The main reaons I feel <span id="prompt-1-blank">[replace]</span> are <span class="blank-underline"></span>
            </h2>
            <div id="prompt-section-1-contents" class="prompt-section-contents">
                <p class="tooltip">Select at least 1</p>
                <ul id="section-1-cluster" class="cluster">
                </ul>
                <h3 class="advance-button advance-button-inactive"><span class="arrow">&rarr;</span> <!-- → --></h3>
            </div>
        </section>

        <section id="prompt-section-2" class="prompt-section">
            <h2 class="prompt-header">
                To feel more optimistic about the future, I'd like to see more <span class="blank-underline"></span>
            </h2>
            <div id="prompt-section-2-contents" class="prompt-section-contents">
                <p class="tooltip">Select at least 1</p>
                <ul id="section-2-cluster" class="cluster">
                </ul>
                <h3 class="advance-button advance-button-inactive"><span class="arrow">&rarr;</span> <!-- → --></h3>
            </div>
        </section>

    </main>
</body>
</html>
