<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- stylesheet -->
    <link href="styles.css" rel="stylesheet">
    <!-- JS -->
    <script src="script.js" defer></script>

    <title>Capstone Title</title>
</head>
<body>
    <main>
        <section class="prompt-section">
            <h2 id="prompt-1" class="prompt-header display-flex-row">I am <span id="op-text-container" class="blank-underline"><span id="op-text"></span></span> about the future.</h2>

            <div id="binary-button-container">
                <h3 class="binary-button pointer-on-hover" id="optimistic-button">optimistic</h3>
                <h3 class="binary-button pointer-on-hover" id="pessimistic-button">pessimistic</h3>
            </div>

            <!-- <p class="advance-button pointer-on-hover advance-button-inactive"><span>Next</span></p> -->
        </section>
        <section class="prompt-section">
            <h2 id="prompt-2-header" class="prompt-header display-flex-row">I feel<span id="prompt-2-blank"></span>because of <span id="prompt-2-blank-underline" class="blank-underline"></span><span id="prompt-2-selection-display"></span></h2>
            <p class="tooltip">Select at least 1 category</p>
        </section>
        <section class="prompt-section">
            <h2 id="prompt-3-header" class="prompt-header display-flex-row">To feel more optimistic about the future, I'd like to see more<span id="prompt-3-blank-underline" class="blank-underline"></span><span id="prompt-3-selection-display"></span></h2>
            <p class="tooltip">Select at least 1 category</p>
        </section>
    </main>
</body>
</html>
