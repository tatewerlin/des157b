<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- stylesheet -->
    <link href="dataviz_styles.css" rel="stylesheet">
    <!-- Parse -->
    <script type="text/javascript" src="https://unpkg.com/parse/dist/parse.min.js"></script>
    <!-- JS -->
    <script src="dataviz.js" defer></script>

    <title>Capstone Title</title>
</head>
<body>
    <main>
        <section id="row-1">
            <h1><span class="percent-display"></span>% of us are optimistic about the future.</h1>
            <p class="response-count-display"></p>
        </section>
        <section id="row-2">
            <div>
                <p class="response-count-display"></p>
                <h2>The main reasons we feel optimistic are:</h2>
                <ul class="category-list"></ul>
            </div>
            <div>
                <p class="response-count-display"></p>
                <h2>The main reasons we feel pessimistic are:</h2>
                <ul class="category-list"></ul>
            </div>
        </section>
        <section id="row-3">
            <p class="response-count-display"></p>
            <h2>What would make us feel more optimistic:</h2>
            <ul class="category-list"></ul>
        </section>
    </main>
</body>
</html>
